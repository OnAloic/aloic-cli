# Managed by Aloic. Relinking the project in the Aloic dashboard
# rewrites this file, so edits made here do not survive.
#
# Unlink the project to remove it, or delete it yourself: nothing here runs
# without the ALOIC_KEY_TEST_PROJECT secret, which is revoked at the same time.

name: Deploy to Aloic

on:
  push:
    branches: ["main"]
  # STARTED FROM ALOIC, and told which deploy it belongs to. Aloic creates the
  # deploy record before dispatching so there is something to watch straight
  # away; the CLI fills that record in rather than making a second one. A push
  # sends no input, so it creates its own the way it always has.
  workflow_dispatch:
    inputs:
      deployment:
        description: The Aloic deploy this build is filling in
        required: false
        type: string

# One deploy at a time. Two pushes a minute apart would otherwise race, and
# the slower build would publish over the newer one.
concurrency:
  group: aloic-test-project
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Aloic CLI
        run: |
          curl -fsSL https://get.aloic.ai | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # THE COMMIT MESSAGE ARRIVES AS AN ENVIRONMENT VARIABLE, NOT AS TEXT
      # PASTED INTO THE SCRIPT. GitHub substitutes ${{ }} before bash sees the
      # line, so a message containing a quote and a semicolon would become a
      # second command running next to the deploy key. Through env it is data.
      - name: Publish to Aloic
        env:
          ALOIC_KEY: ${{ secrets.ALOIC_KEY_TEST_PROJECT }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          ALOIC_DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          TITLE=$(printf '%s' "$COMMIT_MESSAGE" | head -1)
          [ -n "$TITLE" ] || TITLE="Deploy ${GITHUB_SHA:0:7}"
          aloic deploy "dist" --project "test-project" --title "$TITLE"
